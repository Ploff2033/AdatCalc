<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdatBeton Calc</title>
<link rel="stylesheet" href="/v2/styles.css">
</head>
<body>

<!-- ============ ЛОГИН (показывается вместо всего остального, если не авторизован) ============ -->
<div class="login-shell" id="login-screen" hidden>
  <section class="login-hero">
    <div class="stack g10" style="flex-direction: row; align-items: center;">
      <div class="sidebar-brand"><span class="mark">AБ</span><span class="name">AdatBeton Calc</span></div>
    </div>
    <h1>Калькулятор завода ЖБИ</h1>
    <span></span>
  </section>
  <section class="login-form-side">
    <form class="card login-card" id="login-form">
      <div class="stack" style="gap: 4px;"><span class="cap">Вход</span><h2>Войдите по паролю</h2></div>
      <div class="field"><label for="login-password">Пароль</label><input id="login-password" type="password" class="inp" style="height: 48px; font-size: 16px;" autocomplete="current-password"></div>
      <p class="login-error" id="login-error" hidden></p>
      <button class="btn pri" type="submit" style="height: 48px; width: 100%; font-size: 15px;">Войти</button>
      <p class="hint" style="text-align: center; margin: 0;">Ссылка работника (без входа) продолжает работать в <a href="/">прежнем интерфейсе</a>.</p>
    </form>
  </section>
</div>

<!-- ============ ОСНОВНОЕ ПРИЛОЖЕНИЕ ============ -->
<div class="app-shell" id="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="mark">AБ</span>
      <div class="stack">
        <span class="name">AdatBeton Calc</span>
        <span class="role" id="sb-role-label">—</span>
      </div>
    </div>
    <button class="plant-switch-btn" id="sb-plant-switch" aria-haspopup="listbox">
      <span class="stack" style="gap: 1px;"><span class="cap">Завод</span><span class="val" id="sb-plant-name">—</span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <select id="sb-plant-select" class="inp" hidden aria-label="Выбор завода"></select>

    <nav class="nav" id="sb-nav-main" aria-label="Разделы">
      <a href="#/main" data-route="main"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12v5M8 16h2M12 16h2"/></svg><span>Расчёт и заказ</span></a>
      <a href="#/orders" data-route="orders"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Заказы</span></a>
      <a href="#/waybills" data-route="waybills"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span>Путевые листы</span></a>
      <a href="#/stock" data-route="stock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Остатки</span></a>
    </nav>

    <div class="stack sidebar-refs">
      <span class="sidebar-group-label">Справочники</span>
      <nav class="nav" aria-label="Справочники">
        <a href="/" title="Открывает прежний интерфейс — полные справочники материалов/рецептов/персонала пока только там"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/></svg><span>Материалы и рецепты</span></a>
        <a href="/" title="Открывает прежний интерфейс"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/></svg><span>Персонал</span></a>
        <a href="/" title="Открывает прежний интерфейс"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span>Техника</span></a>
      </nav>
    </div>

    <div class="stack g10" style="margin-top: auto;">
      <nav class="nav" id="sb-nav-admin" aria-label="Администрирование">
        <a href="#/dashboard" data-route="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Дашборд</span></a>
        <a href="#/settings" data-route="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Настройки</span></a>
      </nav>
      <div class="sidebar-user">
        <div class="sidebar-user-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="role-name" id="sb-user-role">—</span>
        </div>
        <div class="sidebar-user-actions single"><button class="btn sm ghost-dark" id="sb-logout-btn">Выйти</button></div>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <div id="load-error" class="load-error" hidden></div>

    <!-- ---------- Расчёт и заказ ---------- -->
    <section class="page" data-route="main" hidden id="page-main"></section>

    <!-- ---------- Заказы ---------- -->
    <section class="page" data-route="orders" hidden id="page-orders"></section>

    <!-- ---------- Путевые листы ---------- -->
    <section class="page" data-route="waybills" hidden id="page-waybills"></section>

    <!-- ---------- Остатки ---------- -->
    <section class="page" data-route="stock" hidden id="page-stock"></section>

    <!-- ---------- Дашборд ---------- -->
    <section class="page" data-route="dashboard" hidden id="page-dashboard"></section>

    <!-- ---------- Настройки ---------- -->
    <section class="page" data-route="settings" hidden id="page-settings"></section>
  </div>

  <nav class="bottom-nav nav" aria-label="Разделы (телефон)">
    <a href="#/main" data-route="main"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12v5M8 16h2M12 16h2"/></svg><span>Расчёт</span></a>
    <a href="#/orders" data-route="orders"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Заказы</span></a>
    <a href="#/waybills" data-route="waybills"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span>Листы</span></a>
    <a href="#/stock" data-route="stock"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Остатки</span></a>
  </nav>
</div>

<!-- ============ общие модули (расчёт/api/формат — те же, что в v1) ============ -->
<script src="/v2/shared/format.js"></script>
<script src="/v2/shared/numeric-input.js"></script>
<script src="/v2/shared/calc.js"></script>
<script src="/v2/shared/api.js"></script>
<script src="/v2/shared/plant.js"></script>
<script src="/v2/shared/waybill.js"></script>
<script src="/v2/shared/auth.js"></script>
<script src="/v2/shared/state.js"></script>
<script src="/v2/js/shell.js"></script>
<script src="/v2/js/router.js"></script>
<script src="/v2/js/screen-login.js"></script>
<script src="/v2/js/screen-main.js"></script>
<script src="/v2/js/screen-orders.js"></script>
<script src="/v2/js/screen-waybills.js"></script>
<script src="/v2/js/screen-stock.js"></script>
<script src="/v2/js/screen-dashboard.js"></script>
<script src="/v2/js/screen-settings.js"></script>
<script src="/v2/js/app.js"></script>
</body>
</html>
