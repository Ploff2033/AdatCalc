services:
  db:
    image: postgres:16-alpine
    container_name: adat-calc-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-calc}
      - POSTGRES_USER=${POSTGRES_USER:-calc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calc} -d ${POSTGRES_DB:-calc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  calc:
    build: .
    container_name: adat-calc
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-calc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calc}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

volumes:
  pgdata:
