services:
  db:
    image: postgres:16-alpine
    container_name: adat-calc-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-calc}
      - POSTGRES_USER=${POSTGRES_USER:-calc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calc} -d ${POSTGRES_DB:-calc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Xray-core — пул SOCKS5-прокси до api.telegram.org (с этого сервера
  # Telegram недоступен напрямую на уровне TCP, подтверждено диагностикой).
  # Change telegram-proxy-failover: вместо ручного xray-config.json с одним
  # сервером — свой образ (xray/), супервизор качает VPN-подписку по
  # XRAY_SUBSCRIPTION_URL (только в .env на сервере, секрет) при старте и раз
  # в 6 часов и даёт по SOCKS-порту на каждый VLESS-сервер: xray:10801,
  # xray:10802, … Список портов — в ./xray-state/manifest.json, его читает
  # calc и при сбое отправки сам переключается на следующий сервер.
  # ./xray-state — НЕ в git (конфиг Xray с UUID/ключами подписки). Порты
  # наружу не пробрасываются — только в докер-сети.
  xray:
    build: ./xray
    container_name: adat-xray
    restart: unless-stopped
    environment:
      - XRAY_SUBSCRIPTION_URL=${XRAY_SUBSCRIPTION_URL:-}
    volumes:
      - ./xray-state:/state

  calc:
    build: .
    container_name: adat-calc
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      xray:
        condition: service_started
    volumes:
      - ./data:/app/data
      # Фото чеков ДДС (backend/uploads.js пишет их в backend/uploads/receipts
      # внутри контейнера) — без этого тома пересборка/пересоздание
      # контейнера (docker compose up -d --build) стирала бы все загруженные
      # фото, файловая система контейнера сама по себе не сохраняется.
      - ./uploads:/app/backend/uploads
      # Манифест пула прокси от сервиса xray (только чтение) — см.
      # backend/telegram.js::readManifest. Нет файла — ручной режим.
      - ./xray-state:/app/xray-state:ro
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-calc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calc}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Ручной режим — только когда пула xray нет (нет манифеста). Есть пул —
      # и эта переменная, и поле «Прокси» в Настройках игнорируются.
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      # Публичный адрес для ссылок учредителя в Telegram-уведомлениях реестра
      # оплат (https://домен, без слэша в конце). Пусто — берётся из заголовков запроса.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}

volumes:
  pgdata:
