schema: spec-driven

context: |
  Все артефакты писать на русском. Ключевые слова формата OpenSpec
  (Requirement, Scenario, WHEN, THEN, SHALL, ADDED/MODIFIED) оставлять на английском.
  Предметная область: производство бетона (РБУ), заводы, стройка. Пользователи:
  операторы, руководители подразделений; разработчик один.
  Бизнес-правила, которых нет в коде явно:
  - Рентабельность считается от выручки: цена = себестоимость / 0.9, не наценкой.
  - Исправление проведённых записей — только сторно (компенсирующей записью), не правкой.
  - Единица учёта постепенно меняется с «завод» на «подразделение» (завод, стройка, офис):
    не закладывать завод как единственную сущность.
  - Этап оплаты (решение и платёж) вне системы: им занимается учредитель в Google-таблице.
  - Персональные данные водителей и техники (ВУ, VIN, госномера) не включать
    в артефакты и примеры.
rules:
  proposal:
    - Всегда указывать разделы Out of Scope и Open Questions
    - Указывать зависимости от других change
  specs:
    - Каждое требование содержит минимум один сценарий WHEN/THEN
    - Для формул и расчётов давать числовой пример в сценарии
    - Явно указывать, чего система не трогает
  design:
    - Если данные делятся с внешней системой (таблицей), описывать, кто какими колонками владеет
  tasks:
    - Группировать задачи по разделам; последний раздел — тесты по сценариям спеки

operations:
  apply:
    guidance:
      - Перед стартом проверить, что в proposal нет неотвеченных Open Questions; если есть, остановиться и спросить
      - Задача считается закрытой, когда проходят тесты по её сценариям
  archive:
    guidance:
      - Архивировать только после моего подтверждения, что проверено на реальных данных